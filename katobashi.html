<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="かっとばし">
<meta name="theme-color" content="#e7e0cf">
<title>かっとばし</title>
<link rel="stylesheet" href="yokocho.css">
<style>
  #stages{ overflow:auto; justify-content:flex-start; padding-top:max(60px,env(safe-area-inset-top)); }
  #stages h1{ font-size:clamp(38px,11vw,66px); }
  #stgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:440px; margin-top:8px; }
  .stg{ aspect-ratio:1; border:4px solid #000; border-radius:14px; background:#7fd0ff; color:#0d2a3a;
    font-weight:900; font-size:15px; box-shadow:4px 5px 0 #000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3px; cursor:pointer; text-align:center; padding:4px; }
  .stg:active{ transform:translate(3px,4px); box-shadow:1px 1px 0 #000; }
  .stg .no{ font-size:22px; }
  .stg small{ font-size:10px; font-weight:700; opacity:.72; }
  .stg .bw{ color:#0a6b2f; font-size:10px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <a class="back" href="index.html">← よこちょう</a>

  <div id="hud" class="hidden">
    <div><div class="lbl">ステージ</div><div class="big" id="stageNum">1</div></div>
    <div class="r"><div class="lbl">のこり 玉</div><div class="big" id="life">3</div></div>
  </div>
  <div id="hint" class="hidden">下を なぞって 板を うごかす。玉を 落とすな</div>

  <div id="title" class="screen">
    <h1>かっとばし</h1>
    <div class="sub">板で 打ち返して、<br>上の ブロックを くずせ。</div>
    <button class="btn" id="toStages">ステージを えらぶ</button>
    <div class="pill" style="text-align:left;">
      ・画面の下を <b>なぞって</b> 板を左右に うごかす<br>
      ・玉は <b>当てた位置</b>で はね返る角度が 変わる＝ねらえ<br>
      ・<b>黄「＋」</b>を こわすと 玉が ふえる（大あばれ）<br>
      ・玉<b>どうし</b>も ぶつかる。板に つけず 崩すほど <b>コンボ</b><br>
      ・ステージごとに <b>ブロックの形</b>が ちがう。玉を 落とすと おわり
    </div>
  </div>

  <div id="stages" class="screen hidden">
    <h1>ステージ</h1>
    <div id="stgrid"></div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 id="goTitle">おとした！</h2>
    <div class="score" id="goSub"></div>
    <div class="msg" id="goMsg"></div>
    <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="btn" id="retryBtn">もういっかい</button>
      <button class="btn" id="backStages" style="background:#fff">ステージへ</button>
    </div>
  </div>
</div>

<script src="yokocho.js"></script>
<script src="katobashi.js"></script>
</body>
</html>
