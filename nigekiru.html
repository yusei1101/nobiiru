<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="にげきる">
<meta name="theme-color" content="#e7e0cf">
<title>にげきる</title>
<link rel="stylesheet" href="yokocho.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <a class="back" href="index.html">← よこちょう</a>

  <div id="hud" class="hidden">
    <div><div class="lbl">かい</div><div class="big" id="lv">1</div></div>
    <div class="r"><div class="lbl">のこり しつこいやつ</div><div class="big" id="left">0</div></div>
  </div>

  <div id="title" class="screen">
    <h1>にげきる</h1>
    <div class="sub">交互に 1マスずつ。<br>しつこい人を <b>ぶつけ合わせて</b> 消せ。</div>
    <button class="btn" id="startBtn">はじめる</button>
    <div class="pill" style="text-align:left;">
      ・自分の <b>となりのマス</b>を タップ＝1歩（自分を タップ＝待つ）<br>
      ・あなたが動くと、しつこい人も 1歩 寄ってくる<br>
      ・<b>2人が同じマス</b>／<b>がれきに突っ込む</b> と つぶれて消える<br>
      ・全員 消せば つぎの かい。つかまると おわり。<b>テレポ</b>は少しだけ
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 id="goTitle">つかまった</h2>
    <div class="score" id="goSub"></div>
    <div class="msg" id="goMsg"></div>
    <button class="btn" id="retryBtn">もういっかい</button>
  </div>
</div>

<script src="yokocho.js"></script>
<script src="nigekiru.js"></script>
</body>
</html>
