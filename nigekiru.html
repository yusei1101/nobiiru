<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="にげきる">
<meta name="theme-color" content="#e7e0cf">
<title>にげきる</title>
<link rel="stylesheet" href="yokocho.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <a class="back" href="index.html">← よこちょう</a>

  <div id="hud" class="hidden">
    <div><div class="lbl">かい</div><div class="big" id="lv">1</div></div>
    <div class="r"><div class="lbl">のこり しつこいやつ</div><div class="big" id="left">0</div></div>
  </div>
  <div id="hint" class="hidden">なぞって にげろ！ 岩や 味方に ぶつけて 消せ</div>

  <div id="title" class="screen">
    <h1>にげきる</h1>
    <div class="sub">なぞって にげる。<br>しつこい人を <b>ぶつけて</b> 消せ。</div>
    <button class="btn" id="startBtn">はじめる</button>
    <div class="pill" style="text-align:left;">
      ・画面を <b>なぞって</b> にげる（自分は 速い・追っ手は 遅い）<br>
      ・追っ手を <b>岩</b>に 誘い込むと つぶれる<br>
      ・追っ手<b>どうし</b>を ぶつけると まとめて 消える＝<b>してやったり！</b><br>
      ・全員 消せば つぎの かい。つかまると おわり
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 id="goTitle">つかまった</h2>
    <div class="score" id="goSub"></div>
    <div class="msg" id="goMsg"></div>
    <button class="btn" id="retryBtn">もういっかい</button>
  </div>
</div>

<script src="yokocho.js"></script>
<script src="nigekiru.js"></script>
</body>
</html>
