<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もちつき">
<meta name="theme-color" content="#4a8fb0">
<title>もちつき</title>
<link rel="stylesheet" href="yokocho.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <a class="back" href="index.html">← よこちょう</a>

  <div id="hud" class="hidden">
    <div><div class="lbl">もちの きげん</div><div class="big" id="deki">ふつう</div></div>
    <div class="r"><div class="lbl">いま</div><div class="big" id="sect" style="font-size:22px">-</div></div>
  </div>
  <div id="hint" class="hidden">手が ひっこんだ 拍で タップ！ 手が 出てる ときは 打つな！</div>

  <div id="title" class="screen">
    <h1>もちつき</h1>
    <div class="sub">つくほど もちが おかしくなる。<br>相方の 手は つぶすな。</div>
    <button class="btn" id="startBtn">はじめる</button>
    <div class="pill" style="text-align:left;">
      ・手が <b>ひっこんだ</b>拍で タップ → つく<br>
      ・手が <b>出てる</b>ときに 打つ → つぶす（相方 ブチギレ）<br>
      ・もちが <b>おきる→腕が生える→分裂→暴走→巨大化</b>… 止まらない<br>
      ・点数じゃない。<b>どんな 化け物 に なるか</b>見よう
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 id="goTitle">できた</h2>
    <div class="score" id="goDeki"></div>
    <div class="msg" id="goMsg"></div>
    <button class="btn" id="retryBtn">もういっかい</button>
  </div>
</div>

<script src="yokocho.js"></script>
<script>
"use strict";
(function(){
addEventListener('error',e=>{ let d=document.getElementById('err'); if(!d){ d=document.createElement('div'); d.id='err';
  d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#a00;color:#fff;font:12px monospace;padding:8px;border-radius:8px;white-space:pre-wrap'; document.body.appendChild(d);} d.textContent='ERR: '+(e.message||e); });
const Y=window.Yokocho, D=Y.draw, P=Y.PALETTE;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2.5); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

const BPM=104;
const S={TITLE:0,PLAY:1,OVER:2}; let state=S.TITLE; let R=new Y.Rhythm(BPM);

// ── 暴走する演目。場面ごとに「もちの化け物度」が上がる ──
// flags: pat(手の踊り), eyes(目の数), arms(腕), split(分裂), invert(色反転), giant(巨大化)
const SCRIPT=[
  {name:"しずかに",  beats:8,  pat:"single", say:"しずかに いくぞ…",   eyes:1, },
  {name:"もちが おきた", beats:10, pat:"single", say:"もちが おきたァ！", eyes:2, scream:"ﾔﾒﾛ" },
  {name:"腕が はえた", beats:10, pat:"double", say:"うでっ！？",        eyes:2, arms:true, scream:"ｲﾀｲ" },
  {name:"ぶんれつ",  beats:10, pat:"double", say:"ふえたァ！",        eyes:4, arms:true, split:true, scream:"ﾓﾁﾓﾁ" },
  {name:"ぼうそう",  beats:10, pat:"faint",  say:"とまらん！！",      eyes:4, arms:true, split:true, invert:true, scream:"ｳﾜｰ" },
  {name:"きょだいか", beats:12, pat:"double", say:"でかァ！！",        eyes:6, arms:true, split:true, invert:true, giant:true, scream:"ﾓﾁﾞﾗ" },
];
const START=[]; { let a=0; for(const s of SCRIPT){ START.push(a); a+=s.beats; } START.push(a); }
const END_BEAT=START[START.length-1];

let secIdx=-1, tight=0, good=0, smash=0, whiff=0;
let poundAnim=0, poundKind='', mochiSquish=0, handHurt=0, shake=0, flash=0, flashCol='255,255,255';
let grow=0, anger=0, mochiMouth=0, invertT=0, bannerT="", bannerUntil=-9, lastVoice=-9, screamT=-9;
const floats=[];

function reset(){ R=new Y.Rhythm(BPM); secIdx=-1; tight=good=smash=whiff=0;
  poundAnim=mochiSquish=handHurt=shake=flash=grow=anger=mochiMouth=invertT=0; bannerT=""; bannerUntil=-9; lastVoice=-9; screamT=-9; floats.length=0; }

const usuY=()=>H*0.6, cxc=()=>W*0.5;
function section(){ return SCRIPT[Math.max(0,Math.min(SCRIPT.length-1,secIdx))]; }
function clamp01(v){ return Math.max(0,Math.min(1,v)); }

function handIn(ph,pat,bi){
  if(pat==="double"){ const d=Math.min(Math.abs(ph-0.25),Math.abs(ph-0.75)); return clamp01(1-d/0.15); }
  if(pat==="faint"){ const trap=(bi%4===3); if(trap){ const d=Math.min(ph,1-ph); return clamp01(1-d/0.2); }
    const d=Math.abs(ph-0.5); return clamp01(1-d/0.26); }
  const d=Math.abs(ph-0.5); return clamp01(1-d/0.26);
}
function toTarget(ph,pat){ const ts=pat==="double"?[0,0.5,1]:[0,1]; let m=1; for(const t of ts) m=Math.min(m,Math.abs(ph-t)); return m; }

function onBeat(n,at){ Y.sfx.kick(at); Y.sfx.hat(at+R.spb/2);
  if(n%4===2) setTimeout(()=>{ if(state===S.PLAY) Y.say("あいよ",{char:'niisan',volume:0.8}); }, R.spb*500); }

function start(){ Y.audio.resume(); reset();
  document.getElementById('title').classList.add('hidden'); document.getElementById('gameover').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden'); document.getElementById('hint').classList.remove('hidden');
  state=S.PLAY; R.start(onBeat); }

function finish(){ state=S.OVER; R.stop();
  const q=tight*3+good-smash*6; let deki,msg,title;
  if(smash>=6){ deki="げきおこ もち"; msg="手を つぶしすぎ。もち 逃走。"; title="もちが にげた"; }
  else if(grow>0.8 && q>=30){ deki="もちゴジラ"; msg="ついに 街を こわす サイズに。"; title="かいじゅう 完成"; }
  else if(q>=18){ deki="でかい もち"; msg="なんか でかくて 変な もち。"; title="できた…？"; }
  else { deki="いびつ もち"; msg="へんな かたち。まあ もち。"; title="できた"; }
  document.getElementById('goTitle').textContent=title;
  document.getElementById('goDeki').textContent=deki;
  document.getElementById('goMsg').textContent=msg;
  document.getElementById('hud').classList.add('hidden'); document.getElementById('hint').classList.add('hidden');
  document.getElementById('gameover').classList.remove('hidden'); }

function tap(){
  if(state!==S.PLAY) return; const b=R.beat(); if(b<0) return;
  const sec=section(), ph=((b%1)+1)%1, bi=Math.floor(b);
  const danger=handIn(ph,sec.pat,bi), close=toTarget(ph,sec.pat); poundAnim=1;

  if(danger>0.5){ poundKind='smash'; smash++; handHurt=1; anger=Math.min(1,anger+0.3);
    Y.sfx.bad(); Y.say(["いたっ！","あぁっ！","ちょっ！"][smash%3],{char:'niisan',interrupt:true,pitch:1.4});
    addFloat(cxc()+90,usuY()-40,"ｸﾞｼｬ",'#ff5566',true); shake=18; flash=0.5; flashCol='255,60,80'; return; }

  if(close<0.12){ poundKind='good'; const t=close<0.05; if(t) tight++; else good++;
    Y.sfx.hit(); if(t) Y.sfx.good(); mochiSquish=1; mochiMouth=1; grow=Math.min(1.4, grow+0.05);
    addFloat(cxc(),usuY()-110,t?"ﾄﾞｽﾝ!":"どすっ",t?P.pop:'#fff',t); burst(cxc(),usuY()-30,t?12:7);
    shake=t?13:8; flash=0.3; flashCol='255,240,120';
    // もちが 悲鳴(声。場面が進むほど頻繁)
    const sec2=section();
    if(sec2.scream && b-screamT>1.1){ screamT=b; Y.say(sec2.scream,{char:'mochi',interrupt:true,pitch:1.5+grow*0.3}); }
    else if(b-lastVoice>1.8){ lastVoice=b; Y.say(t?"よいしょ！":"ほい",{char:'ossan',volume:0.85}); }
    return; }
  poundKind='whiff'; whiff++; Y.sfx.whiff(); addFloat(cxc(),usuY()-80,"すかっ",'#c9b98a',false);
}

function addFloat(x,y,text,col,big){ floats.push({x,y,text,col,big:!!big,life:1,vy:-52,rot:(Math.random()*2-1)*10}); }
function burst(x,y,n){ for(let i=0;i<n;i++){ const a=-Math.PI/2+(i/n-0.5)*2.3,sp=200+Math.random()*200;
  floats.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dot:true,col:'244,240,230'}); } }

function update(dt){
  poundAnim=Math.max(0,poundAnim-dt*5); mochiSquish=Math.max(0,mochiSquish-dt*4);
  mochiMouth=Math.max(0,mochiMouth-dt*3); handHurt=Math.max(0,handHurt-dt*2);
  anger=Math.max(0,anger-dt*0.15); shake*=Math.pow(0.0015,dt); if(shake<0.3)shake=0; flash=Math.max(0,flash-dt*2.4);
  invertT=Math.max(0,invertT-dt);
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; if(f.dot){ f.vy+=1000*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; } else { f.y+=f.vy*dt; f.vy*=0.9; }
    f.life-=dt*(f.dot?2:1.3); if(f.life<=0) floats.splice(i,1); }

  if(state===S.PLAY){ const b=R.beat();
    if(b>=0){ let idx=0; while(idx<SCRIPT.length && b>=START[idx+1]) idx++;
      if(idx!==secIdx && idx<SCRIPT.length){ secIdx=idx; const s=SCRIPT[idx];
        bannerT=s.name; bannerUntil=b+2.4; document.getElementById('sect').textContent=s.name;
        Y.say(s.say,{char:'narr',interrupt:true}); shake=14; if(s.invert) invertT=0.3; } }
    document.getElementById('deki').textContent = smash>=5?"ブチギレ":grow>0.9?"ばけもの":grow>0.5?"でかい":"ふつう";
    if(b>=END_BEAT) finish();
  }
}

function draw(){
  ctx.save(); let ox=0,oy=0; if(shake>0){ ox=(Math.random()*2-1)*shake; oy=(Math.random()*2-1)*shake; } ctx.translate(ox,oy);
  const sec=section(), invert = (state===S.PLAY && (sec.invert && ((R.beat()*2|0)%2===0))) || invertT>0;
  // 背景(暴走場面で色反転)
  ctx.fillStyle= invert? '#2a0f1a' : P.sky; ctx.fillRect(-20,-20,W+40,H*0.66);
  ctx.fillStyle= invert? '#40122a' : P.dirt; ctx.fillRect(-20,H*0.64,W+40,H);
  ctx.strokeStyle=P.ink; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(-10,H*0.64); ctx.lineTo(W+10,H*0.64-4); ctx.stroke();
  ctx.fillStyle=invert?'#ff5a8a':P.pop; ctx.strokeStyle=P.ink; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(W*0.14,H*0.14,26,0,7); ctx.fill(); ctx.stroke();

  if(state===S.PLAY||state===S.OVER){
    const b=state===S.PLAY?R.beat():END_BEAT; const ph=((b%1)+1)%1;
    const hin=state===S.PLAY?handIn(ph,sec.pat,Math.floor(b)):0;
    drawUsu();
    drawMochiMonster(sec);
    // つき手 ブヨ
    D.creature(ctx,P.buyo,{x:W*0.22,y:usuY()+6,scale:1,rot:-0.05,mouthOpen:0.3+poundAnim*0.6,brow:0.5},D.buyoBody);
    drawKine();
    // 返し手 ノッポ(パニック度は場面で上昇)
    const hurt=handHurt>0, panic=Math.min(1,(secIdx)/4);
    D.creature(ctx,P.noppo,{x:W*0.82,y:usuY()+8,scale:0.95,rot:0.05,neck:34,
      mouthOpen:hurt?0.9:(0.2+panic*0.6),brow:hurt?-0.9:(0.6+panic*0.4),dead:hurt&&handHurt>0.5},D.noppoBody);
    drawHand(hin,hurt);
  }

  for(const f of floats){ ctx.globalAlpha=Math.max(0,f.life);
    if(f.dot){ ctx.fillStyle=`rgba(${f.col},${f.life})`; ctx.beginPath(); ctx.arc(f.x,f.y,4*f.life+1,0,7); ctx.fill(); }
    else { ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.rot*Math.PI/180); ctx.font=`900 ${f.big?52:30}px sans-serif`;
      ctx.textAlign='center'; ctx.lineWidth=7; ctx.strokeStyle=P.ink; ctx.strokeText(f.text,0,0);
      ctx.fillStyle=f.col; ctx.fillText(f.text,0,0); ctx.restore(); } }
  ctx.globalAlpha=1;

  if(state===S.PLAY && R.beat()<bannerUntil){ ctx.save(); ctx.translate(W/2,H*0.28); ctx.rotate(-0.05);
    ctx.font='900 44px sans-serif'; ctx.textAlign='center'; ctx.lineWidth=9; ctx.strokeStyle=P.ink;
    ctx.strokeText(bannerT,0,0); ctx.fillStyle=P.pop; ctx.fillText(bannerT,0,0); ctx.restore(); }

  ctx.restore();
  if(flash>0){ ctx.fillStyle=`rgba(${flashCol},${flash*0.5})`; ctx.fillRect(0,0,W,H); }
}

function drawUsu(){ const x=cxc(),y=usuY()+40; ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.moveTo(-88,-4); ctx.quadraticCurveTo(-88,54,0,54); ctx.quadraticCurveTo(88,54,88,-4);
  ctx.quadraticCurveTo(74,-26,0,-26); ctx.quadraticCurveTo(-74,-26,-88,-4); D.fillInk(ctx,'#3a2a1a',7);
  ctx.beginPath(); ctx.ellipse(0,-8,80,22,0,0,7); D.fillInk(ctx,'#5a4428',5); ctx.restore(); }

// もちの化け物。grow/eyes/arms/split で どんどん おかしくなる。
function drawMochiMonster(sec){
  const cx=cxc(), cy=usuY()+20+ (sec.giant?-30:0);
  const base = 46 + grow*80 * (sec.giant?1.5:1);
  const sq=1-mochiSquish*0.35, wob=Math.sin((state===S.PLAY?R.beat():0)*6)*4*(0.5+anger);
  ctx.save(); ctx.translate(cx,cy);
  // 腕(場面で生える)。太い黒縁の上に白で塗って手描きの太い腕に。
  if(sec.arms){ ctx.lineCap='round';
    for(const s of [-1,1]){ const ax=s*base*0.9, ay=-base*0.2, ex=ax+s*20+wob, ey=ay-70-poundAnim*30, w=Math.max(8,base*0.22);
      ctx.beginPath(); ctx.moveTo(s*base*0.5,0); ctx.quadraticCurveTo(ax,ay-30,ex,ey);
      ctx.strokeStyle=P.ink; ctx.lineWidth=w+6; ctx.stroke();
      ctx.strokeStyle=P.paper; ctx.lineWidth=w; ctx.stroke();
      // 手先の玉
      ctx.beginPath(); ctx.arc(ex,ey,w*0.7,0,7); ctx.fillStyle=P.paper; ctx.fill(); ctx.strokeStyle=P.ink; ctx.lineWidth=3; ctx.stroke();
    }
  }
  // 本体(ぶよぶよ)
  ctx.save(); ctx.scale((1+mochiSquish*0.2), sq);
  ctx.beginPath();
  const n=14; for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2, rr=base*(1+Math.sin(a*3+ (state===S.PLAY?R.beat():0))*0.06*(0.5+anger));
    const px=Math.cos(a)*rr, py=Math.sin(a)*rr*0.8 - base*0.2; i===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
  ctx.closePath(); D.fillInk(ctx, anger>0.4?'#ffe6e6':P.paper, Math.max(5,base*0.09));
  ctx.restore();
  // 目(数が増える)
  const eyes=sec.eyes||1; ctx.fillStyle=P.ink;
  for(let i=0;i<eyes;i++){ const a=(i/eyes)*Math.PI*2 - Math.PI/2, ex=Math.cos(a)*base*0.4, ey=Math.sin(a)*base*0.3 - base*0.25;
    const er=base*0.12; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex,ey,er,0,7); ctx.fill(); ctx.strokeStyle=P.ink; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle=P.ink; ctx.beginPath(); ctx.arc(ex+wob*0.3,ey+2,er*0.5,0,7); ctx.fill(); }
  // 口(悲鳴で開く)
  const mo=Math.max(mochiMouth, anger*0.4), mw=base*0.4, mh=base*(0.08+mo*0.5), my=base*0.15;
  ctx.beginPath(); ctx.ellipse(0,my,mw,mh,0,0,7); ctx.fillStyle='#7a1c12'; ctx.fill(); ctx.strokeStyle=P.ink; ctx.lineWidth=4; ctx.stroke();
  if(mo>0.4){ ctx.fillStyle='#fff'; for(let k=-1;k<=1;k+=2){ ctx.fillRect(k*mw*0.4-4, my-mh, 8, mh*0.5); } } // 歯
  // 分裂: 小さいもち顔が横に
  if(sec.split){ for(const s of [-1,1]){ ctx.save(); ctx.translate(s*base*0.95, base*0.1); const r2=base*0.4;
    ctx.beginPath(); ctx.arc(0,0,r2,0,7); D.fillInk(ctx,P.paper,4);
    ctx.fillStyle=P.ink; ctx.beginPath(); ctx.arc(-r2*0.3,-r2*0.1,r2*0.16,0,7); ctx.arc(r2*0.3,-r2*0.1,r2*0.16,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(0,r2*0.2,r2*0.25,0,Math.PI); ctx.strokeStyle=P.ink; ctx.lineWidth=3; ctx.stroke(); ctx.restore(); } }
  ctx.restore();
}
function drawKine(){ const down=poundAnim, topY=usuY()-200+down*160, x=cxc()-4+(poundKind==='smash'?52:0);
  ctx.save(); ctx.translate(x,topY); ctx.rotate(-0.12*(1-down));
  ctx.beginPath(); ctx.roundRect(-10,0,20,160,6); D.fillInk(ctx,'#a9793f',5);
  ctx.beginPath(); ctx.roundRect(-38,-44,76,50,12); D.fillInk(ctx,'#c99a55',6); ctx.restore(); }
function drawHand(hin,hurt){ const x0=W*0.82-34,y0=usuY()+30,tx=cxc()+34,ty=usuY()+6;
  const px=x0+(tx-x0)*hin,py=y0+(ty-y0)*hin+(hurt?(Math.random()*2-1)*5:0);
  ctx.strokeStyle=P.ink; ctx.lineWidth=11; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(px,py); ctx.stroke();
  ctx.fillStyle=hurt?'#ff8a8a':P.noppo; ctx.strokeStyle=P.ink; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(px,py,13,0,7); ctx.fill(); ctx.stroke(); }

document.getElementById('startBtn').addEventListener('click',e=>{e.stopPropagation();start();});
document.getElementById('retryBtn').addEventListener('click',e=>{e.stopPropagation();start();});
addEventListener('pointerdown',e=>{ const t=e.target; if(t&&t.closest&&(t.closest('.btn')||t.closest('.back'))) return;
  if(state===S.PLAY){ e.preventDefault(); tap(); } },{passive:false});

let tPrev=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-tPrev)/1000); tPrev=now; update(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
