<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ビンタ">
<meta name="theme-color" content="#e7e0cf">
<title>ビンタ</title>
<link rel="stylesheet" href="yokocho.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <a class="back" href="index.html">← よこちょう</a>

  <div id="hud" class="hidden">
    <div><div class="lbl">れんしょう</div><div class="big" id="streak">0</div></div>
    <div class="r"><div class="lbl">のこり</div><div class="big" id="life">3</div></div>
  </div>
  <div id="hint" class="hidden">「！」が でたら すぐ タップ！ お手つき きんし</div>

  <div id="title" class="screen">
    <h1>ビンタ</h1>
    <div class="sub">「！」の しゅんかん、<br>さきに タップした ほうが <b>ビンタ</b>。</div>
    <button class="btn" id="startBtn">はじめる</button>
    <div class="pill" style="text-align:left;">
      ・「かまえ…」の あと <b>「！」</b>が 出たら すぐ タップ<br>
      ・<b>相手より 速ければ</b> ビンタ成立＝勝ち<br>
      ・「！」の <b>前</b>に 押したら <b>お手つき</b>＝負け<br>
      ・たまに <b>フェイント</b>や <b>達人</b>が 出る。釣られるな<br>
      ・のこりが 0で おわり。何連勝 できるか
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 id="goTitle">やられた</h2>
    <div class="score" id="goSub"></div>
    <div class="msg" id="goMsg"></div>
    <button class="btn" id="retryBtn">もういっかい</button>
  </div>
</div>

<script src="yokocho.js"></script>
<script src="binta.js"></script>
</body>
</html>
