<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="すみません">
<meta name="theme-color" content="#a9d3ee">
<title>すみません</title>
<link rel="stylesheet" href="yokocho.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <a class="back" href="index.html">← よこちょう</a>

  <div id="hud" class="hidden">
    <div><div class="lbl">ばめん</div><div class="big" id="sect" style="font-size:22px">-</div></div>
    <div class="r"><div class="lbl">のこり</div><div class="big" id="left">-</div></div>
  </div>
  <div id="hint" class="hidden">画面を なぞって 人を よけろ！ ぶつかると「すみません」</div>

  <div id="title" class="screen">
    <h1>すみません</h1>
    <div class="sub">人混みを かき分けて、<br>最後まで たどり着け。</div>
    <button class="btn" id="startBtn">はじめる</button>
    <div class="pill" style="text-align:left;">
      ・画面を <b>なぞって</b> 自分を うごかす（指の 少し上に 出る）<br>
      ・変な人が いっぱい：急停止・Uターン・スマホ・子供・立ち話・ダッシュ<br>
      ・ぶつかると きぶん −1（3つで おわり）。場面は どんどん 変わる
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 id="goTitle">ぶじ ぬけた</h2>
    <div class="score" id="goSub"></div>
    <div class="msg" id="goMsg"></div>
    <button class="btn" id="retryBtn">もういっかい</button>
  </div>
</div>

<script src="yokocho.js"></script>
<script>
"use strict";
(function(){
// 実機で万一エラーが出たら、凍結でなく画面に出す(こちらで実行確認できないため)
addEventListener('error',e=>{ let d=document.getElementById('err'); if(!d){ d=document.createElement('div'); d.id='err';
  d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#a00;color:#fff;font:12px monospace;padding:8px;border-radius:8px;white-space:pre-wrap'; document.body.appendChild(d);} d.textContent='ERR: '+(e.message||e); });
const Y=window.Yokocho, P=Y.PALETTE;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2.5); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();

// 歩ける帯(横視点)。上は空とビル。
const bandTop=()=>H*0.34, bandBot=()=>H*0.96;
const PR=22, NR=17, FOLLOW=520, FINGER_UP=46;

// 群衆の色(旧doketeの色をそのまま拝借)
const CLOTH=["#e05b5b","#4f86c6","#57b36b","#e8a13b","#9b6dd6","#43b0a6","#d96ba0","#6c7a89","#c0563e"];
const SKIN=["#f6d2b0","#f0c29a","#e3ae7e","#ce9366","#b07a4e"];
const HAIR=["#2b2320","#4a3b2e","#6b4e2e","#8a8f98","#1f1b18","#9c6b3f"];
const rc=a=>a[(Math.random()*a.length)|0];

// ── 1プレイ内で変わる場面 ──
const SCENES=[
  {name:"ゆうがたの みち", dur:9,  gap:0.9, kinds:["normal","normal","phone","slow"],           say:"いくよー"},
  {name:"スマホ だらけ",   dur:10, gap:0.8, kinds:["phone","phone","stop","normal"],            say:"スマホ 多め！"},
  {name:"たちばなしの かべ",dur:10, gap:1.3, kinds:["talk","talk","normal"],                    say:"立ち話 じゃまー"},
  {name:"こどもが とびだす",dur:10, gap:0.7, kinds:["child","child","runner","normal"],          say:"子供 あぶない！"},
  {name:"みんな いそぐ",   dur:12, gap:0.5, kinds:["runner","sprint","runner","child","normal"], say:"ラッシュ！"},
];
let sceneStart=[]; { let a=0; for(const s of SCENES){ sceneStart.push(a); a+=s.dur; } sceneStart.push(a); }
const TOTAL=sceneStart[sceneStart.length-1];

const S={TITLE:0,PLAY:1,OVER:2}; let state=S.TITLE;
let t=0, secIdx=-1, mood=3, dodged=0, bumps=0, grace=1.2, invuln=0, shake=0, flash=0;
let bannerT="", bannerUntil=-9, spawnT=0;
const npcs=[]; const player={x:0,y:0,tx:0,ty:0};
let dragging=false;

function reset(){ t=0; secIdx=-1; mood=3; dodged=0; bumps=0; grace=1.2; invuln=0; shake=0; flash=0;
  bannerT=""; bannerUntil=-9; spawnT=0; npcs.length=0;
  player.x=W/2; player.y=(bandTop()+bandBot())/2; player.tx=player.x; player.ty=player.y; }

function scene(){ return SCENES[Math.max(0,Math.min(SCENES.length-1,secIdx))]; }

function spawnNpc(kind){
  const fromLeft=Math.random()<0.5;
  const y=bandTop()+NR+Math.random()*(bandBot()-bandTop()-NR*2);
  const base={ x:fromLeft?-NR*2:W+NR*2, y, kind,
    cloth:rc(CLOTH), skin:rc(SKIN), hair:rc(HAIR),
    scale:kind==="child"?0.55+Math.random()*0.12:0.85+Math.random()*0.35,
    dir:fromLeft?1:-1, vx:0, t0:0, tell:0, phase:Math.random()*6.28, gone:false };
  const spd={normal:58,phone:40,slow:26,stop:54,uturn:58,runner:132,child:96,sprint:58,talk:0}[kind]||58;
  base.spd=spd; base.vx=base.dir*spd;
  if(kind==="talk"){ base.x=NR*3+Math.random()*(W-NR*6); base.vx=0; base.stand=3+Math.random()*3; }
  npcs.push(base);
  // 立ち話は連れが1〜2人
  if(kind==="talk"){ const n=1+((Math.random()*2)|0);
    for(let i=0;i<n;i++){ npcs.push({...base, x:base.x+(i+1)*NR*1.9*(Math.random()<.5?1:-1),
      cloth:rc(CLOTH),skin:rc(SKIN),hair:rc(HAIR), phase:Math.random()*6.28}); } }
}

function updNpc(n,dt){
  n.t0+=dt;
  switch(n.kind){
    case "stop": { const c=Math.floor(n.t0)%3; n.vx = c===2?0:n.dir*n.spd; break; }
    case "uturn": { if(n.t0>1.4+ n.phase*0.2){ n.dir*=-1; n.t0=0; } n.vx=n.dir*n.spd; break; }
    case "child": { n.vx=n.dir*n.spd; n.y+=Math.sin(n.t0*7+n.phase)*60*dt; break; }
    case "phone": { n.vx=n.dir*n.spd; n.y+=Math.sin(n.t0*1.5+n.phase)*10*dt; break; }
    case "sprint": { if(n.tell<=0 && n.t0>1.2){ n.tell=0.6; } if(n.tell>0){ n.tell-=dt; n.vx=n.dir*n.spd; if(n.tell<=0){ n.dashing=1.2; } }
      if(n.dashing>0){ n.dashing-=dt; n.vx=n.dir*155; } break; }
    case "talk": { n.stand-=dt; if(n.stand<=0){ n.vx=n.dir*54; } break; }
    default: n.vx=n.dir*n.spd;
  }
  n.x+=n.vx*dt;
  n.y=Math.max(bandTop()+NR, Math.min(bandBot()-NR, n.y));
  if(n.x< -NR*3 || n.x>W+NR*3) n.gone=true;
}

function start(){ Y.audio.resume(); reset();
  document.getElementById('title').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  state=S.PLAY; }

function finish(clear){ state=S.OVER;
  document.getElementById('goTitle').textContent = clear?"ぶじ ぬけた":"はぐれた";
  document.getElementById('goSub').textContent = clear?"かき分け 成功":"人混みに のまれた";
  document.getElementById('goMsg').textContent = clear
    ? (bumps===0?"一度も ぶつからず 通過。名人。":"なんとか 最後まで たどり着いた。")
    : "きぶんが 尽きた。また 挑戦しよう。";
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('hint').classList.add('hidden');
  document.getElementById('gameover').classList.remove('hidden');
}

function update(dt){
  if(state!==S.PLAY) return;
  t+=dt; if(grace>0) grace-=dt; if(invuln>0) invuln-=dt;
  shake*=Math.pow(0.002,dt); if(shake<0.3)shake=0; flash=Math.max(0,flash-dt*2.4);

  // 場面進行
  let idx=0; while(idx<SCENES.length && t>=sceneStart[idx+1]) idx++;
  if(idx!==secIdx && idx<SCENES.length){ secIdx=idx; const s=SCENES[idx];
    bannerT=s.name; bannerUntil=t+2.2; document.getElementById('sect').textContent=s.name;
    Y.say(s.say,{interrupt:true,rate:1.15,pitch:1.05}); }
  if(t>=TOTAL){ finish(true); return; }

  // スポーン
  const s=scene(); spawnT-=dt;
  if(spawnT<=0 && npcs.length<28){ spawnNpc(rc(s.kinds)); spawnT=s.gap*(0.7+Math.random()*0.6); }

  // プレイヤー追従
  const dx=player.tx-player.x, dy=player.ty-player.y, d=Math.hypot(dx,dy);
  if(d>1){ const step=Math.min(d,FOLLOW*dt); player.x+=dx/d*step; player.y+=dy/d*step; }
  player.x=Math.max(PR,Math.min(W-PR,player.x));
  player.y=Math.max(bandTop()+PR,Math.min(bandBot()-PR,player.y));

  // NPC更新＋当たり
  for(let i=npcs.length-1;i>=0;i--){ const n=npcs[i]; updNpc(n,dt); if(n.gone){ npcs.splice(i,1); dodged++; continue; }
    if(grace<=0 && invuln<=0){
      const ex=PR*0.7+NR*n.scale*0.7, ey=PR+NR*n.scale;
      const ddx=n.x-player.x, ddy=n.y-player.y;
      if((ddx*ddx)/(ex*ex)+(ddy*ddy)/(ey*ey)<1){ bump(); }
    }
  }
}

function bump(){ bumps++; mood--; invuln=1.1; shake=15; flash=0.45;
  Y.sfx.bad(); Y.say("すみません！",{interrupt:true,rate:1.35,pitch:1.15});
  if(mood<=0) finish(false); updLeft();
}
function updLeft(){ document.getElementById('left').textContent = "き".repeat(0)+mood; }

function draw(){
  ctx.save(); let ox=0,oy=0; if(shake>0){ ox=(Math.random()*2-1)*shake; oy=(Math.random()*2-1)*shake; } ctx.translate(ox,oy);
  // 空・ビル・歩道(手描き)
  ctx.fillStyle="#a9d3ee"; ctx.fillRect(-20,-20,W+40,bandTop()+20);
  drawBuildings();
  ctx.fillStyle="#e4e0d6"; ctx.fillRect(-20,bandTop(),W+40,H);
  ctx.strokeStyle="#c9c2b2"; ctx.lineWidth=3;
  for(let gy=bandTop()+30;gy<H;gy+=46){ ctx.beginPath(); ctx.moveTo(-10,gy); ctx.lineTo(W+10,gy); ctx.stroke(); }
  ctx.strokeStyle=P.ink; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-10,bandTop()); ctx.lineTo(W+10,bandTop()); ctx.stroke();

  if(state===S.PLAY||state===S.OVER){
    // 奥から手前へ(yで並べる)
    const list=npcs.slice().sort((a,b)=>a.y-b.y);
    for(const n of list) drawPerson(n.x,n.y,NR*n.scale,n,false);
    // プレイヤー
    const blink = invuln>0 && (Math.floor(t*12)%2===0);
    if(!blink) drawPerson(player.x,player.y,PR,{cloth:"#ff2d6b",skin:"#ffd9b0",hair:"#3a2320",dir:1,phase:t*6},true);
  }

  // バナー
  if(state===S.PLAY && t<bannerUntil){ ctx.save(); ctx.translate(W/2,H*0.24); ctx.rotate(-0.03);
    ctx.font='900 34px sans-serif'; ctx.textAlign='center'; ctx.lineWidth=8; ctx.strokeStyle=P.ink;
    ctx.strokeText(bannerT,0,0); ctx.fillStyle=P.pop; ctx.fillText(bannerT,0,0); ctx.restore(); }
  // きぶん(手描きの玉)
  drawMood();
  ctx.restore();
  if(flash>0){ ctx.fillStyle=`rgba(255,60,80,${flash*0.5})`; ctx.fillRect(0,0,W,H); }
}

function drawBuildings(){ const bw=64, top=bandTop();
  for(let i=0, x=-20; x<W+40; i++, x+=bw){ const h=top*(0.45+((i*7)%5)*0.09);
    ctx.fillStyle=i%2?"#9fb0c0":"#8598ab"; ctx.fillRect(x,top-h,bw-6,h);
    ctx.strokeStyle=P.ink; ctx.lineWidth=3; ctx.strokeRect(x,top-h,bw-6,h);
    ctx.fillStyle="#fff3c4"; for(let wy=top-h+10;wy<top-10;wy+=20){ for(let wx=x+8;wx<x+bw-14;wx+=18){ if((wx+wy)%3) ctx.fillRect(wx,wy,8,10); } } }
}

// 手描きの通行人(横視点)。歩き足つき。
function drawPerson(x,y,r,n,isPlayer){
  const walk=Math.sin((n.phase||0)+ (n.vx?x*0.05:0));
  ctx.save(); ctx.translate(x,y);
  // 影
  ctx.fillStyle="rgba(0,0,0,.16)"; ctx.beginPath(); ctx.ellipse(0,r*1.2,r*0.9,r*0.3,0,0,7); ctx.fill();
  // 足
  ctx.strokeStyle=P.ink; ctx.lineWidth=Math.max(3,r*0.18); ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(-r*0.25,r*0.5); ctx.lineTo(-r*0.25+walk*r*0.4,r*1.15);
  ctx.moveTo(r*0.25,r*0.5); ctx.lineTo(r*0.25-walk*r*0.4,r*1.15); ctx.stroke();
  // 胴
  ctx.beginPath(); ctx.moveTo(-r*0.6,r*0.55); ctx.quadraticCurveTo(-r*0.7,-r*0.2,0,-r*0.35);
  ctx.quadraticCurveTo(r*0.7,-r*0.2,r*0.6,r*0.55); ctx.quadraticCurveTo(0,r*0.75,-r*0.6,r*0.55);
  ctx.fillStyle=n.cloth; ctx.fill(); ctx.lineWidth=Math.max(3,r*0.16); ctx.strokeStyle=P.ink; ctx.stroke();
  // 頭
  ctx.beginPath(); ctx.arc(0,-r*0.62,r*0.5,0,7); ctx.fillStyle=n.skin; ctx.fill(); ctx.stroke();
  // 髪
  ctx.beginPath(); ctx.arc(0,-r*0.7,r*0.52,Math.PI*1.05,Math.PI*1.95); ctx.fillStyle=n.hair; ctx.fill();
  // 予備動作(ダッシュ前)の黄リング
  if(n.tell>0){ ctx.strokeStyle="#ffc400"; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,r*1.5,0,7); ctx.stroke(); }
  // スマホ
  if(n.kind==="phone"){ ctx.fillStyle="#222"; ctx.fillRect(r*0.2,-r*0.2,r*0.35,r*0.5); }
  ctx.restore();
}
function drawMood(){ const x=W-30, y=64;
  for(let i=0;i<3;i++){ const on=i<mood; ctx.save(); ctx.translate(x-i*30,y);
    ctx.beginPath(); ctx.moveTo(0,-8); ctx.quadraticCurveTo(-13,-8,-13,3); ctx.quadraticCurveTo(-13,15,0,20);
    ctx.quadraticCurveTo(13,15,13,3); ctx.quadraticCurveTo(13,-8,0,-8);
    if(on){ ctx.fillStyle=P.pop; ctx.fill(); } ctx.strokeStyle=on?P.ink:'#8a94a6'; ctx.lineWidth=3; ctx.stroke(); ctx.restore(); }
}

// 入力: なぞって移動(指の少し上に自分が出る)
function setTarget(e){ player.tx=e.clientX; player.ty=e.clientY-FINGER_UP; }
addEventListener('pointerdown',e=>{ const el=e.target;
  if(el&&el.closest&&(el.closest('.btn')||el.closest('.back'))) return;
  if(state===S.PLAY){ e.preventDefault(); dragging=true; setTarget(e); } },{passive:false});
addEventListener('pointermove',e=>{ if(dragging&&state===S.PLAY){ e.preventDefault(); setTarget(e); } },{passive:false});
addEventListener('pointerup',()=>{ dragging=false; });
document.getElementById('startBtn').addEventListener('click',e=>{e.stopPropagation();start();});
document.getElementById('retryBtn').addEventListener('click',e=>{e.stopPropagation();start();});

let tPrev=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-tPrev)/1000); tPrev=now; update(dt);
  if(state===S.PLAY){ document.getElementById('left').textContent=mood; } draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
