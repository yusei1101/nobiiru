<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ボタンとおすぎ">
<meta name="theme-color" content="#8fd0e8">
<title>ボタン とおすぎ</title>
<link rel="stylesheet" href="yokocho.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <a class="back" href="index.html">← よこちょう</a>

  <div id="hud" class="hidden">
    <div><div class="lbl">かい</div><div class="big" id="round">1</div></div>
    <div class="r"><div class="lbl">のこり</div><div class="big" id="life">3</div></div>
  </div>
  <div id="hint" class="hidden">画面を <b>れんだ</b>して ボタンまで 走れ！</div>

  <div id="title" class="screen">
    <h1 style="font-size:clamp(38px,13vw,80px)">ボタン<br>とおすぎ</h1>
    <div class="sub">早押しクイズ。<br>でも ボタンが <b>とおすぎ</b>。</div>
    <button class="btn" id="startBtn">はじめる</button>
    <div class="pill" style="text-align:left;">
      ・お題が 出る → <b>画面を れんだ</b>して 走る<br>
      ・でも ボタンは <b>理不尽に とおい</b>。ズルい ライバルは <b>やたら 近い</b><br>
      ・先に ボタンを 押せば <b>ピンポン！</b> 負けると <b>ブブー</b>（のこり−1）<br>
      ・勝つほど ボタンは <b>もっと とおくなる</b>
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 id="goTitle">おわり</h2>
    <div class="score" id="goSub"></div>
    <div class="msg" id="goMsg"></div>
    <button class="btn" id="retryBtn">もういっかい</button>
  </div>
</div>

<script src="yokocho.js"></script>
<script src="botan.js"></script>
</body>
</html>
