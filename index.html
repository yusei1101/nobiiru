<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ヘンゲー横丁">
<meta name="theme-color" content="#1a1533">
<title>ヘンゲー横丁</title>
<style>
  /* ------------------------------------------------------------------
     ヘンゲー横丁 ＝ 変なゲームの寄せ集めトップ(ハブ)。
     野田ゲー的に「わざと雑・手描き・ケバい」。ツルッと綺麗にしない。
     ゲームは GAMES 配列に1行足すだけで増える。各ゲームは単一HTML。
     ------------------------------------------------------------------ */
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; min-height:100%; background:#1a1533; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:#fff; user-select:none; -webkit-user-select:none;
    overflow-x:hidden; padding: max(18px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    position:relative;
  }
  /* 背景にふわふわ漂うヘンな絵文字(シュール要員) */
  #bg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .float{ position:absolute; font-size:44px; opacity:.13; animation:drift linear infinite; }
  @keyframes drift{ from{ transform:translateY(20px) rotate(0) } to{ transform:translateY(-40px) rotate(360deg) } }

  #head{ position:relative; z-index:1; text-align:center; margin: 8px 0 26px; }
  #head h1{
    display:inline-block; font-size:clamp(52px,17vw,96px); font-weight:900; letter-spacing:-3px;
    color:#ffe14d; text-shadow: 4px 4px 0 #000, 7px 7px 0 rgba(0,0,0,.25);
    transform: rotate(-3deg); line-height:.95;
  }
  #head .sub{ margin-top:14px; font-size:clamp(13px,4vw,17px); font-weight:700; color:#c8c2e6; }
  #head .eye{ font-size:.5em; vertical-align:.35em; }

  #grid{ position:relative; z-index:1; max-width:520px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:18px 16px; }
  .card{
    position:relative; border-radius:20px; border:4px solid #000; cursor:pointer;
    padding:18px 12px 16px; text-align:center; color:#1a1210;
    box-shadow: 5px 6px 0 #000; transition: transform .07s, box-shadow .07s;
    min-height:158px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .card:active{ transform: translate(4px,5px) rotate(0deg)!important; box-shadow:1px 1px 0 #000; }
  .card .emoji{ font-size:56px; line-height:1; filter: drop-shadow(2px 3px 0 rgba(0,0,0,.25)); }
  .card .name{ font-size:22px; font-weight:900; }
  .card .tag{ font-size:12px; font-weight:700; opacity:.72; line-height:1.4; }
  .card.soon{ background:#40395f!important; color:#b7b0d8; border-style:dashed; border-color:#6b6398;
    box-shadow:none; cursor:default; }
  .card.soon:active{ transform:none!important; box-shadow:none; }
  .card .badge{ position:absolute; top:-12px; right:-8px; background:#ff4d6d; color:#fff;
    font-size:11px; font-weight:900; padding:4px 9px; border-radius:999px; border:3px solid #000;
    transform:rotate(8deg); }

  /* 押せないカードを押した時の雑なトースト */
  #toast{ position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px);
    background:#000; color:#ffe14d; font-weight:900; font-size:16px; padding:12px 22px;
    border-radius:999px; border:3px solid #ffe14d; z-index:9; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #foot{ position:relative; z-index:1; text-align:center; margin-top:30px;
    font-size:12px; font-weight:700; color:#6b6398; }
</style>
</head>
<body>
  <div id="bg"></div>

  <div id="head">
    <h1>ヘンゲー<br>横丁</h1>
    <div class="sub">しょうもない ゲーム あつめ <span class="eye">👁️</span></div>
  </div>

  <div id="grid"></div>

  <div id="foot">タップして あそぶ ・ どんどん ふえる よてい</div>
  <div id="toast"></div>

<script>
"use strict";
(function(){
  /* ゲーム追加はここに1行足すだけ。ready:false は「じゅんびちゅう」表示。 */
  const GAMES = [
    { href:"nobiiru.html",  emoji:"🫧", name:"のびーる",   tag:"首のばして たべる",   color:"#7fe0c8", ready:true,  badge:"" },
    { href:"tsukkomi.html", emoji:"👋", name:"ツッコミ",   tag:"リズムで ばしっ",     color:"#ff9d4d", ready:true,  badge:"NEW" },
    { href:"",              emoji:"❓", name:"じゅんびちゅう", tag:"なにか つくってる",   color:"", ready:false, badge:"" },
    { href:"",              emoji:"❓", name:"じゅんびちゅう", tag:"なにか つくってる",   color:"", ready:false, badge:"" },
  ];

  // 背景のふわふわ絵文字
  const BGE = ["🍡","🧦","🚽","👁️","🍣","🪨","👟","🧻","🍤","🦷","🌀","🍕"];
  const bg = document.getElementById("bg");
  for(let i=0;i<12;i++){
    const s=document.createElement("div"); s.className="float";
    s.textContent = BGE[i%BGE.length];
    s.style.left = (i*8.5 % 96) + "%";
    s.style.top  = ((i*37) % 100) + "%";
    s.style.animationDuration = (7 + (i%5)*2.5) + "s";
    s.style.animationDelay = (-i*0.8) + "s";
    s.style.fontSize = (34 + (i%4)*12) + "px";
    bg.appendChild(s);
  }

  // カード生成。1ゲーム1カード。雑に少し傾ける。
  const grid = document.getElementById("grid");
  const tilts = [-2.5, 2, -1.5, 2.5];
  GAMES.forEach((g,i)=>{
    const c=document.createElement("div");
    c.className = "card" + (g.ready ? "" : " soon");
    c.style.transform = "rotate("+tilts[i%tilts.length]+"deg)";
    if(g.ready) c.style.background = g.color;
    c.innerHTML =
      (g.badge ? '<div class="badge">'+g.badge+'</div>' : '') +
      '<div class="emoji">'+g.emoji+'</div>' +
      '<div class="name">'+g.name+'</div>' +
      '<div class="tag">'+g.tag+'</div>';
    c.addEventListener("click", ()=>{
      if(g.ready && g.href){ location.href = g.href; }
      else { toast("まだ じゅんび できてない！"); }
    });
    grid.appendChild(c);
  });

  let toastT=null;
  const toastEl=document.getElementById("toast");
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"),1400);
  }
})();
</script>
</body>
</html>
