<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ヘンゲー横丁">
<meta name="theme-color" content="#1a1533">
<title>ヘンゲー横丁</title>
<style>
  /* ------------------------------------------------------------------
     ヘンゲー横丁 ＝ 変なゲームの寄せ集めトップ(ハブ)。
     野田ゲー的に「わざと雑・手描き・ケバい」。ツルッと綺麗にしない。
     ゲームは GAMES 配列に1行足すだけで増える。各ゲームは単一HTML。
     ------------------------------------------------------------------ */
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; min-height:100%; background:#1a1533; }
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:#fff; user-select:none; -webkit-user-select:none;
    overflow-x:hidden; padding: max(18px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    position:relative;
  }
  /* 背景にふわふわ漂うヘンな絵文字(シュール要員) */
  #bg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .float{ position:absolute; font-size:44px; opacity:.13; animation:drift linear infinite; }
  @keyframes drift{ from{ transform:translateY(20px) rotate(0) } to{ transform:translateY(-40px) rotate(360deg) } }

  #head{ position:relative; z-index:1; text-align:center; margin: 8px 0 26px; }
  #head h1{
    display:inline-block; font-size:clamp(52px,17vw,96px); font-weight:900; letter-spacing:-3px;
    color:#ffe14d; text-shadow: 4px 4px 0 #000, 7px 7px 0 rgba(0,0,0,.25);
    transform: rotate(-3deg); line-height:.95;
  }
  #head .sub{ margin-top:14px; font-size:clamp(13px,4vw,17px); font-weight:700; color:#c8c2e6; }
  #head .eye{ font-size:.5em; vertical-align:.35em; }

  #grid{ position:relative; z-index:1; max-width:520px; margin:0 auto;
    display:grid; grid-template-columns:1fr 1fr; gap:18px 16px; }
  .card{
    position:relative; border-radius:20px; border:4px solid #000; cursor:pointer;
    padding:18px 12px 16px; text-align:center; color:#1a1210;
    box-shadow: 5px 6px 0 #000; transition: transform .07s, box-shadow .07s;
    min-height:158px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  }
  .card:active{ transform: translate(4px,5px) rotate(0deg)!important; box-shadow:1px 1px 0 #000; }
  .card .icon{ height:60px; display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(2px 3px 0 rgba(0,0,0,.2)); }
  .card .name{ font-size:22px; font-weight:900; }
  .card .tag{ font-size:12px; font-weight:700; opacity:.72; line-height:1.4; }
  .card.soon{ background:#40395f!important; color:#b7b0d8; border-style:dashed; border-color:#6b6398;
    box-shadow:none; cursor:default; }
  .card.soon:active{ transform:none!important; box-shadow:none; }
  .card .badge{ position:absolute; top:-12px; right:-8px; background:#ff4d6d; color:#fff;
    font-size:11px; font-weight:900; padding:4px 9px; border-radius:999px; border:3px solid #000;
    transform:rotate(8deg); }

  /* 押せないカードを押した時の雑なトースト */
  #toast{ position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px);
    background:#000; color:#ffe14d; font-weight:900; font-size:16px; padding:12px 22px;
    border-radius:999px; border:3px solid #ffe14d; z-index:9; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #foot{ position:relative; z-index:1; text-align:center; margin-top:30px;
    font-size:12px; font-weight:700; color:#6b6398; }
  /* スマホで あそぶ(PCで開いた時だけ出す) */
  #phoneBtn{ position:relative; z-index:1; display:block; margin:22px auto 0; background:#ffe14d; color:#1a1210; font-weight:900; font-size:16px;
    border:4px solid #000; border-radius:999px; padding:10px 22px; box-shadow:4px 5px 0 #000; cursor:pointer; font-family:inherit; }
  #phoneBtn:active{ transform:translate(3px,4px); box-shadow:1px 1px 0 #000; }
  #phone{ position:fixed; inset:0; z-index:20; background:rgba(14,10,30,.92); display:none; align-items:center; justify-content:center; padding:16px; }
  #phone.show{ display:flex; }
  #phone .box{ background:#2a2346; border:4px solid #000; border-radius:20px; box-shadow:6px 7px 0 #000; padding:20px; max-width:520px; color:#fff;
    display:flex; gap:18px; flex-wrap:wrap; align-items:center; justify-content:center; text-align:left; }
  #qr{ background:#fff; padding:10px; border-radius:10px; min-width:180px; min-height:180px; display:flex; align-items:center; justify-content:center; color:#555; font-size:13px; }
  #phone .txt{ font-size:14px; line-height:1.8; max-width:280px; }
  #phone .txt b{ color:#ffe14d; }
  #phone code{ display:inline-block; background:#fff; color:#1a1210; border-radius:6px; padding:3px 8px; margin:3px 0; font-size:12px; user-select:text; -webkit-user-select:text; }
  #phone small{ display:block; color:#c8c2e6; font-size:12px; margin-top:6px; }
  #phoneClose{ margin-top:10px; background:#fff; border:3px solid #000; border-radius:999px; padding:6px 18px; font-weight:900; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>
  <div id="bg"></div>

  <div id="head">
    <h1>ヘンゲー<br>横丁</h1>
    <div class="sub">しょうもない ゲーム あつめ <svg width="22" height="16" viewBox="0 0 28 20" style="vertical-align:-2px"><ellipse cx="14" cy="10" rx="12" ry="8" fill="#fff" stroke="#1a1206" stroke-width="2.5"/><circle cx="14" cy="10" r="4" fill="#1a1206"/></svg></div>
  </div>

  <div id="grid"></div>

  <button id="phoneBtn">スマホで あそぶ</button>
  <div id="foot">タップして あそぶ ・ どんどん ふえる よてい</div>
  <div id="phone"><div class="box">
    <div id="qr">よみこみ中…</div>
    <div class="txt"><b>スマホのカメラで QRを読む</b>か、このアドレスを開いてね<br><span id="phoneUrls"></span>
      <small>スマホと このPCを 同じWi-Fiに つなぐ ・ PCで「ヘンゲー横丁をあそぶ.bat」を起動したままにする</small>
      <button id="phoneClose">とじる</button></div>
  </div></div>
  <div id="toast"></div>

<script>
"use strict";
(function(){
  /* 絵文字は使わない。アイコンも手描きの小さなSVG。
     ゲーム追加はここに1行足すだけ。ready:false は「じゅんびちゅう」表示。 */
  const G = "#1a1206"; // 手描きの黒
  const ICON = {
    nobiiru:`<svg width="60" height="58" viewBox="0 0 64 64"><g stroke="${G}" stroke-width="4" stroke-linejoin="round">
      <path d="M16 58 q-6 -20 16 -22 q22 2 16 22z" fill="#4fae8f"/><rect x="27" y="18" width="10" height="22" fill="#4fae8f"/>
      <ellipse cx="32" cy="14" rx="11" ry="10" fill="#4fae8f"/></g>
      <circle cx="28" cy="13" r="2.4" fill="${G}"/><circle cx="36" cy="13" r="2.4" fill="${G}"/></svg>`,
    mochi:`<svg width="60" height="58" viewBox="0 0 64 64"><g stroke="${G}" stroke-width="4" stroke-linejoin="round">
      <path d="M12 40 q0 17 20 17 q20 0 20 -17 q-6 -6 -20 -6 q-14 0 -20 6z" fill="#3a2a1a"/>
      <ellipse cx="32" cy="37" rx="17" ry="5" fill="#f4efe2"/>
      <g transform="rotate(20 44 20)"><rect x="40" y="6" width="9" height="28" rx="3" fill="#a9793f"/><rect x="35" y="2" width="19" height="10" rx="4" fill="#c99a55"/></g></g></svg>`,
    dokete:`<svg width="60" height="58" viewBox="0 0 64 64"><g stroke="${G}" stroke-width="3.5" stroke-linejoin="round">
      <circle cx="20" cy="24" r="8" fill="#4f86c6"/><rect x="15" y="31" width="10" height="16" rx="4" fill="#4f86c6"/>
      <circle cx="44" cy="24" r="8" fill="#57b36b"/><rect x="39" y="31" width="10" height="16" rx="4" fill="#57b36b"/>
      <circle cx="32" cy="30" r="9" fill="#ff2d6b"/><rect x="26" y="38" width="12" height="18" rx="5" fill="#ff2d6b"/></g></svg>`,
    nigekiru:`<svg width="60" height="58" viewBox="0 0 64 64"><g stroke="${G}" stroke-width="3" fill="none">
      <rect x="8" y="8" width="48" height="48" fill="#e9e1cd"/>
      <line x1="24" y1="8" x2="24" y2="56"/><line x1="40" y1="8" x2="40" y2="56"/>
      <line x1="8" y1="24" x2="56" y2="24"/><line x1="8" y1="40" x2="56" y2="40"/></g>
      <circle cx="16" cy="48" r="6.5" fill="#ff2d6b" stroke="${G}" stroke-width="2"/>
      <circle cx="48" cy="16" r="6.5" fill="#d64b3a" stroke="${G}" stroke-width="2"/></svg>`,
    botan:`<svg width="60" height="58" viewBox="0 0 64 64">
      <circle cx="10" cy="46" r="6" fill="#ff2d6b" stroke="${G}" stroke-width="2.5"/>
      <path d="M6 56 h52" stroke="${G}" stroke-width="3" stroke-dasharray="4 4"/>
      <ellipse cx="50" cy="40" rx="12" ry="6" fill="#7a1c12"/><ellipse cx="50" cy="34" rx="12" ry="7" fill="#e03b2a" stroke="${G}" stroke-width="2.5"/>
      <path d="M26 20 q0 -8 8 -8 q8 0 8 8" fill="none" stroke="${G}" stroke-width="3"/><circle cx="34" cy="26" r="2.5" fill="${G}"/></svg>`,
    katobashi:`<svg width="60" height="58" viewBox="0 0 64 64"><g stroke="${G}" stroke-width="3" stroke-linejoin="round">
      <rect x="10" y="8" width="13" height="10" rx="2" fill="#ff8a3d"/><rect x="25" y="8" width="13" height="10" rx="2" fill="#4fae8f"/><rect x="40" y="8" width="13" height="10" rx="2" fill="#e0603f"/>
      <rect x="17" y="20" width="13" height="10" rx="2" fill="#4f86c6"/><rect x="33" y="20" width="13" height="10" rx="2" fill="#ffd23e"/>
      <circle cx="38" cy="40" r="6" fill="#d64b3a"/>
      <rect x="16" y="50" width="30" height="7" rx="3.5" fill="#a9793f"/></g>
      <circle cx="36" cy="39" r="1.6" fill="${G}"/><circle cx="40" cy="39" r="1.6" fill="${G}"/></svg>`,
    petaken:`<svg width="60" height="58" viewBox="0 0 64 64"><g stroke="${G}" stroke-width="3.5" stroke-linejoin="round">
      <rect x="6" y="10" width="24" height="26" rx="3" fill="#fff" transform="rotate(-8 18 23)"/><rect x="10" y="14" width="16" height="18" fill="#ff8fb0" transform="rotate(-8 18 23)"/>
      <rect x="34" y="10" width="24" height="26" rx="3" fill="#fff" transform="rotate(8 46 23)"/><rect x="38" y="14" width="16" height="18" fill="#8fd0ff" transform="rotate(8 46 23)"/>
      <path d="M14 36 v14 M22 36 v14 M42 36 v14 M50 36 v14" fill="none"/>
      <circle cx="30" cy="30" r="6" fill="#e8443a"/><circle cx="36" cy="34" r="6" fill="#3a7be8"/></g></svg>`,
    soon:`<svg width="54" height="54" viewBox="0 0 64 64"><text x="32" y="47" font-size="42" font-weight="900" text-anchor="middle" fill="#b7b0d8" stroke="${G}" stroke-width="2" paint-order="stroke" font-family="sans-serif">？</text></svg>`,
  };
  const GAMES = [
    { href:"nobiiru.html", icon:ICON.nobiiru, name:"のびーる", tag:"首のばして たべる", color:"#7fe0c8", ready:true,  badge:"" },
    { href:"mochi.html",   icon:ICON.mochi,   name:"もちつき", tag:"いろんな曲で ぺったん・手つぶすな", color:"#ff8a3d", ready:true,  badge:"NEW" },
    { href:"dokete.html",  icon:ICON.dokete,  name:"すみません", tag:"人混み かき分け・レベル制", color:"#8fd0e8", ready:true,  badge:"" },
    { href:"nigekiru.html",icon:ICON.nigekiru,name:"にげきる", tag:"なぞって にげる・ぶつけて消す", color:"#b8a6ff", ready:true,  badge:"" },
    { href:"katobashi.html",icon:ICON.katobashi,name:"かっとばし", tag:"打ち返して くずす・落とすな", color:"#7fd0ff", ready:true,  badge:"NEW" },
    { href:"kakutou.html", icon:ICON.petaken, name:"ペタ拳", tag:"すきな画像で なぐりあい", color:"#ff9fb8", ready:true,  badge:"NEW" },
    { href:"",             icon:ICON.soon,    name:"じゅんびちゅう", tag:"筋トレ…ふえる", color:"", ready:false, badge:"" },
  ];

  // 背景のふわふわ(手描きの雑な形。絵文字は使わない)
  const BLOB = [
    `<svg viewBox="0 0 40 40"><path d="M20 4 q14 2 14 16 q0 14 -14 16 q-14 -2 -14 -16 q0 -14 14 -16z" fill="#fff" stroke="#1a1206" stroke-width="3"/></svg>`,
    `<svg viewBox="0 0 40 40"><path d="M20 3 l5 11 l12 1 l-9 8 l3 12 l-11 -7 l-11 7 l3 -12 l-9 -8 l12 -1z" fill="#fff" stroke="#1a1206" stroke-width="3"/></svg>`,
    `<svg viewBox="0 0 40 40"><path d="M6 20 q6 -12 14 0 q6 12 14 0" fill="none" stroke="#1a1206" stroke-width="4"/></svg>`,
  ];
  const bg = document.getElementById("bg");
  for(let i=0;i<12;i++){
    const s=document.createElement("div"); s.className="float";
    const sz=(34 + (i%4)*14);
    s.innerHTML = BLOB[i%BLOB.length];
    const svg=s.firstChild; svg.setAttribute("width",sz); svg.setAttribute("height",sz);
    s.style.left = (i*8.5 % 96) + "%";
    s.style.top  = ((i*37) % 100) + "%";
    s.style.animationDuration = (7 + (i%5)*2.5) + "s";
    s.style.animationDelay = (-i*0.8) + "s";
    bg.appendChild(s);
  }

  // カード生成。1ゲーム1カード。雑に少し傾ける。
  const grid = document.getElementById("grid");
  const tilts = [-2.5, 2, -1.5, 2.5];
  GAMES.forEach((g,i)=>{
    const c=document.createElement("div");
    c.className = "card" + (g.ready ? "" : " soon");
    c.style.transform = "rotate("+tilts[i%tilts.length]+"deg)";
    if(g.ready) c.style.background = g.color;
    c.innerHTML =
      (g.badge ? '<div class="badge">'+g.badge+'</div>' : '') +
      '<div class="icon">'+g.icon+'</div>' +
      '<div class="name">'+g.name+'</div>' +
      '<div class="tag">'+g.tag+'</div>';
    c.addEventListener("click", ()=>{
      if(g.ready && g.href){ location.href = g.href; }
      else { toast("まだ じゅんび できてない！"); }
    });
    grid.appendChild(c);
  });

  // ---- スマホで あそぶ: このPCのアドレスを serve.py に聞いて、QRを出す ----
  const touch = ("ontouchstart" in window) || navigator.maxTouchPoints>0;
  const phoneBtn=document.getElementById("phoneBtn"), phone=document.getElementById("phone");
  if(touch) phoneBtn.style.display="none";
  let qrLib=null;
  const loadQR=()=> qrLib || (qrLib=new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; s.onload=()=>res(window.QRCode); s.onerror=rej; document.head.appendChild(s); }));
  phoneBtn.onclick=async()=>{
    phone.classList.add("show");
    const box=document.getElementById("qr"), urls=document.getElementById("phoneUrls"); box.textContent="よみこみ中…";
    const path=location.pathname.replace(/[^/]*$/,"")+"index.html";
    let list=[];
    try{ const j=await (await fetch("/__lan",{cache:"no-store"})).json();
      const rank=(ip)=>/^(192\.168|10\.|172\.(1[6-9]|2\d|3[01]))/.test(ip)?0:(/^100\./.test(ip)?2:1);
      list=j.ips.sort((a,b)=>rank(a)-rank(b)).map(ip=>"http://"+ip+":"+j.port+path); }catch(e){}
    // 公開サイト(GitHub Pages 等)で開いている時は、そのアドレスをそのまま出す
    if(!list.length && /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname)) list=[location.origin+path];
    if(!list.length){ box.textContent="アドレスを 調べられませんでした"; urls.textContent="「ヘンゲー横丁をあそぶ.bat」で起動してから もう一度"; return; }
    urls.innerHTML=list.map(()=>"<code></code>").join("<br>"); [...urls.querySelectorAll("code")].forEach((c,i)=>c.textContent=list[i]);
    try{ const QR=await loadQR(); box.innerHTML=""; new QR(box,{text:list[0],width:180,height:180,correctLevel:QR.CorrectLevel.M}); }
    catch(e){ box.textContent="QRを出せませんでした。アドレスを手で入れてね"; }
  };
  document.getElementById("phoneClose").onclick=()=>phone.classList.remove("show");

  let toastT=null;
  const toastEl=document.getElementById("toast");
  function toast(msg){
    toastEl.textContent=msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove("show"),1400);
  }
})();
</script>
</body>
</html>
